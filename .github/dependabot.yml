version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # pyproject.toml and uv.lock. requirements.txt repeats the direct pins
  # by hand; scripts/check-pins.py fails the docs build until it matches.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      docs:
        patterns: ["*"]
