# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: d-SEAMS Wiki
site_description: Project guides, examples, and process notes for d-SEAMS
site_author: d-SEAMS Core Team
site_url: https://wiki.dseams.info
theme:
  name: material
  language: en
  palette:
    primary: blue grey
    accent: indigo
  font:
    text: Rubik
    code: Ubuntu Mono
  logo: images/logo.png
  favicon: images/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.path
    - navigation.top
    - navigation.footer

repo_name: d-SEAMS/wiki
repo_url: https://github.com/d-SEAMS/wiki
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2019 d-SEAMS Core Team

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/d-SEAMS
      name: d-SEAMS on GitHub

nav:
  - Home: index.md
  - Examples:
      - seams CLI: examples/cli.md
      - CHILL+: examples/chillPlus.md
      - Bulk cages: examples/bulkTopologicalCriterion.md
      - Fingerprint: examples/fingerprint.md
      - Ions: examples/ions.md
      - Ice features: examples/features.md
      - PLUMED: examples/plumed.md
      - Ice nanotube: examples/iceNanotube.md
      - Monolayer: examples/monolayer.md
      - In-plane RDF: examples/rdf2d.md
  - Lua:
      - Compiled registrations: lua/functions.md
      - Lua references: lua/references.md
  - Process:
      - Contributing: 02_Contributing.md
      - Code of Conduct: 01_Code_of_Conduct.md
      - Writing docs: 00_docWriting.md
      - License: 03_license.md
      - SQM plan: "SQM Plan/index.md"
      - Style guide: "SQM Plan/00_styleGuide.md"

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true
