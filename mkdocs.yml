# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json

site_name: d-SEAMS
site_description: Analyse water and ice structure with d-SEAMS
site_author: d-SEAMS Core Team
site_url: https://wiki.dseams.info
theme:
  name: material
  language: en
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false
  logo: images/logo.png
  favicon: images/favicon.ico
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - search.suggest

repo_name: d-SEAMS/wiki
repo_url: https://github.com/d-SEAMS/wiki
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2019-2026 d-SEAMS Core Team

extra_css:
  - stylesheets/dseams.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/d-SEAMS
      name: d-SEAMS on GitHub

nav:
  - Home: index.md
  - Tutorials:
      - Bulk ice and hydrate cages: tutorials/bulk-ice.md
      - Ice nanotubes: tutorials/nanotubes.md
      - Monolayer rings: tutorials/monolayer.md
      - CHILL+ and q6: tutorials/order-parameters.md
      - Ice/water interface: tutorials/interface.md
      - Nucleation: tutorials/nucleation.md
      - Radial distributions: tutorials/rdf.md
      - Ions: tutorials/ions.md
      - On the fly with PLUMED: tutorials/plumed.md
  - How-to guides:
      - Choose a cutoff: howto/cutoff.md
      - Triclinic cells: howto/triclinic.md
      - Read a trajectory: howto/readers.md
      - Large systems: howto/threading.md
      - Export labels: howto/export.md
      - Paper figures: howto/paper.md
  - Explanation:
      - Primitive rings: explanation/rings.md
      - Prisms and cages: explanation/cages.md
      - Two ways to name ice: explanation/criteria.md
      - Other tools: explanation/other-tools.md
      - linkcell: explanation/linkcell.md
  - Reference:
      - Glossary: reference/glossary.md
      - Structure gallery: reference/gallery.md
      - Publications: reference/publications.md
  - Community:
      - Contributing: community/contributing.md
      - Code of conduct: community/code-of-conduct.md
      - Writing docs: community/writing.md
      - License: community/license.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true

plugins:
  - search
  - minify:
      minify_html: true
