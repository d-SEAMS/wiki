# External link check of the wiki source.
# Local fragments in the built site are covered by
# scripts/check-site-links.py.

offline = false
accept = ["200", "202", "206", "429"]
max_retries = 3
timeout = 20
user_agent = "dseams-wiki-lychee"

# Third-party URLs that stay dead to this checker and cannot be
# rewritten to a working replacement.
exclude = [
    # FSF homepage: TLS handshake failure in lychee 0.24 rustls.
    # The GNU FDL 1.3 text in docs/03_license.md still names this URL.
    '^https://fsf.org/',
    # GNU licenses landing: lychee 0.24 rustls times out or reports
    # InvalidContentType. urllib gets HTTP 200. The FDL 1.3 legal
    # sentence in docs/03_license.md must keep this URL.
    '^https://www.gnu.org/licenses',
    # ACS and PNAS (and the doi.org hop to those hosts) return 403
    # to automated clients. The DOI is the citation; no other public
    # landing replaces it.
    '^https://doi.org/',
    '^https://pubs.acs.org/',
    '^https://www.pnas.org/',
]
